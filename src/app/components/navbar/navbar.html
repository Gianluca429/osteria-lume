<header class="navbar" [class.navbar--open]="isMenuOpen()" [class.navbar--scrolled]="isScrolled()">
  <div class="container navbar__inner">
    <a class="navbar__logo" href="#" (click)="closeMenu()">
      <span>Osteria</span>
      <strong>Lume</strong>
    </a>

    <!-- Desktop navigation -->
    <nav class="navbar__links" aria-label="Navigazione principale">
      <a href="#menu">Menu</a>
      <a href="#cucina">La cucina</a>
      <a href="#galleria">Galleria</a>
      <a href="#contatti">Contatti</a>
    </nav>

    <a class="navbar__cta" href="#prenota"> Prenota </a>

    <!-- Mobile toggle -->
    <button
      class="navbar__menu-toggle"
      type="button"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="isMenuOpen() ? 'Chiudi menu' : 'Apri menu'"
      (click)="toggleMenu()"
    >
      <span>
        {{ isMenuOpen() ? 'Chiudi' : 'Menu' }}
      </span>

      <span class="navbar__menu-icon" aria-hidden="true"></span>
    </button>
  </div>

  <!-- Mobile menu -->
  <div
    class="navbar__mobile"
    id="mobile-menu"
    [class.navbar__mobile--open]="isMenuOpen()"
    [attr.aria-hidden]="!isMenuOpen()"
  >
    <div class="container navbar__mobile-inner">
      <nav class="navbar__mobile-links" aria-label="Navigazione mobile">
        <a href="#menu" (click)="closeMenu()">
          <span>01</span>
          Menu
        </a>

        <a href="#cucina" (click)="closeMenu()">
          <span>02</span>
          La cucina
        </a>

        <a href="#galleria" (click)="closeMenu()">
          <span>03</span>
          Galleria
        </a>

        <a href="#contatti" (click)="closeMenu()">
          <span>04</span>
          Contatti
        </a>
      </nav>

      <a class="navbar__mobile-cta" href="#prenota" (click)="closeMenu()">
        Prenota un tavolo
        <span aria-hidden="true">→</span>
      </a>

      <div class="navbar__mobile-footer">
        <a href="#"> Instagram ↗ </a>

        <span>Milano</span>
      </div>
    </div>
  </div>
</header>
