<section class="menu-preview" id="menu">
  <div class="container">
    <header class="menu-preview__header">
      <p class="menu-preview__eyebrow" appReveal [revealDelay]="0">Dalla cucina</p>

      <h2 class="menu-preview__title" appReveal [revealDelay]="80">
        Una carta che cambia con le stagioni.
      </h2>
    </header>

    <div class="menu-preview__grid" appReveal [revealDelay]="160">
      @for (item of menuItems; track item.name) {
        <article class="menu-card">
          <div class="menu-card__image-wrapper">
            <img class="menu-card__image" [src]="item.image" [alt]="item.alt" />
          </div>

          <div class="menu-card__content">
            <div class="menu-card__heading">
              <h3>{{ item.name }}</h3>
              <span>{{ item.price }}</span>
            </div>

            <p>
              {{ item.description }}
            </p>
          </div>
        </article>
      }
    </div>

    <div class="menu-preview__action" appReveal [revealDelay]="220">
      <a href="#menu-completo"> Scopri il menu completo </a>
    </div>
  </div>
</section>
